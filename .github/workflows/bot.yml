name: 🎃 Halloween Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
            - name: Checkout code
        uses: actions/checkout@v4

            - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

            - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

            - name: Check bot
        run: |
          python -m py_compile bot.py
          echo "✅ Bot code is valid!"

  # Optional: Auto deploy to Render if you connect it
